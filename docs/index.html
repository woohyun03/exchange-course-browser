<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exchange Planner</title>
  <link rel="stylesheet" href="static/style.css?v=79c23f0552ff">
</head>
<body id="exchange-planner">
<header class="identity">
  <a class="identity-link" href="./" data-plan-link>
    <span class="school-badge" data-school="hku" aria-hidden="true">HKU</span>
    <span>Exchange Planner</span>
  </a>
</header>
<main>


<section class="setup" aria-labelledby="exchange-title">
  <div class="setup-copy">
    <h1 id="exchange-title">Plan your exchange</h1>
    <p>Choose an exchange university and semester to start looking for courses.</p>
    <form id="exchange-setup" method="get" action="feature/1/">
      <label for="exchange-university">Exchange university</label>
      <select id="exchange-university" name="destination" required>

        <option value="3">University College London</option>

        <option value="2" selected>University of Toronto</option>

      </select>
      <label for="exchange-semester">Exchange semester</label>
      <select id="exchange-semester" name="semester" required>

        <option value="Sem 1">Semester 1</option>

        <option value="Sem 2">Semester 2</option>

      </select>
      <button class="main-action" type="submit">Start planning <span aria-hidden="true">→</span></button>
    </form>
  </div>
  <aside class="route-panel" aria-label="Your exchange route">

    <figure class="campus-figure">
      <img data-campus-photo width="960" height="640"
           src="static/campus/toronto.jpg?v=460c03004c10" alt="Entrance to University College at the University of Toronto">
      <figcaption>
        <span data-campus-place>Toronto, Canada</span>
        <span class="photo-credit">
          Photo by <a data-campus-credit href="https://commons.wikimedia.org/wiki/File:University_College_in_Toronto.jpg" target="_blank" rel="noopener noreferrer">City of Toronto</a>
          · <a data-campus-license href="https://creativecommons.org/licenses/by/2.0/" target="_blank" rel="noopener noreferrer">CC BY 2.0</a>
          · cropped
        </span>
      </figcaption>
    </figure>
    <template id="campus-images">

      <img data-campus="2" src="static/campus/toronto.jpg?v=460c03004c10" alt="Entrance to University College at the University of Toronto">

      <img data-campus="3" src="static/campus/ucl.jpg?v=e818f1b0f210" alt="Columns of the University College London portico">

    </template>

    <div class="journey">
      <div class="stop">
        <span class="school-badge" data-school="hku" aria-hidden="true">HKU</span>
        <div><span class="caption">Home university</span><strong>The University of Hong Kong</strong></div>
      </div>
      <div class="stop">
        <span class="school-badge" data-school="toronto"
              data-destination-badge aria-hidden="true">U of T</span>
        <div>
          <span class="caption">Exchange university</span>
          <strong data-destination-name>University of Toronto</strong>
          <span class="route-term" data-semester-name>Semester 1</span>
        </div>
      </div>
    </div>
  </aside>
</section>

</main>

<script id="exchange-choices" type="application/json">{"destinations": [[3, "University College London"], [2, "University of Toronto"]], "semesters": ["Sem 1", "Sem 2"]}</script>
<script id="campus-photos" type="application/json">{"2": {"alt": "Entrance to University College at the University of Toronto", "badge": "U of T", "city": "Toronto, Canada", "credit": "City of Toronto", "file": "toronto.jpg", "license": "CC BY 2.0", "license_url": "https://creativecommons.org/licenses/by/2.0/", "source": "https://commons.wikimedia.org/wiki/File:University_College_in_Toronto.jpg", "theme": "toronto"}, "3": {"alt": "Columns of the University College London portico", "badge": "UCL", "city": "London, United Kingdom", "credit": "Raya Sharbain", "file": "ucl.jpg", "license": "CC BY-SA 4.0", "license_url": "https://creativecommons.org/licenses/by-sa/4.0/", "source": "https://commons.wikimedia.org/wiki/File:Portico_of_University_College_London.jpg", "theme": "ucl"}}</script>
<script src="static/plan.js?v=171c22b763ea" defer></script>



</body>
</html>
