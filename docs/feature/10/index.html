<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find popular courses · Exchange Student Course Browser</title>
  <link rel="stylesheet" href="../../static/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="../../">Exchange Student Course Browser</a>

  <nav aria-label="Main navigation"><a href="../../">All tools</a></nav>

</header>
<main>

<h1 class="feature-title">Find popular courses</h1>
<p class="dim feature-description">See which courses reached a minimum number of enrollments in a semester.</p>


<form class="block form" data-feature="10" method="get" action="./">

  <label>
    <span class="label">University</span>

      <select name="uni_id" required>
        <option value="">— choose —</option>

        <option value="1" >The University of Hong Kong</option>

        <option value="3" >University College London</option>

        <option value="2" >University of Toronto</option>

      </select>

  </label>

  <label>
    <span class="label">Semester</span>

      <select name="term" required>
        <option value="">— choose —</option>

        <option value="Sem 1" >Sem 1</option>

        <option value="Sem 2" >Sem 2</option>

      </select>

  </label>

  <label>
    <span class="label">Minimum enrollments</span>

      <input type="number" name="min_enrollments"
             value=""
             min="1" max="9007199254740991" step="1" required>

  </label>

  <button type="submit">Find popular courses</button>
</form>


<div id="preview-result" aria-live="polite"></div>


</main>

<script src="../../static/sql-wasm.js" defer></script>
<script src="../../static/preview.js" defer></script>

</body>
</html>
