<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel-friendly timetable · Exchange Student Course Browser</title>
  <link rel="stylesheet" href="../../static/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="../../">Exchange Student Course Browser</a>

  <nav aria-label="Main navigation"><a href="../../">All tools</a></nav>

</header>
<main>

<h1 class="feature-title">Travel-friendly timetable</h1>
<p class="dim feature-description">Find Monday to Wednesday classes that start at or after your chosen time.</p>


<form class="block form" data-feature="3" method="get" action="./">

  <label>
    <span class="label">University</span>

      <select name="uni_id" required>
        <option value="">— choose —</option>

        <option value="1" >The University of Hong Kong</option>

        <option value="3" >University College London</option>

        <option value="2" >University of Toronto</option>

      </select>

  </label>

  <label>
    <span class="label">Earliest start time</span>

      <input type="time" name="earliest_start"
             value="" required>

  </label>

  <button type="submit">Find classes</button>
</form>


<div id="preview-result" aria-live="polite"></div>


</main>

<script src="../../static/sql-wasm.js" defer></script>
<script src="../../static/preview.js" defer></script>

</body>
</html>
