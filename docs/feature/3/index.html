<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel-friendly timetable · Exchange Planner</title>
  <link rel="stylesheet" href="../../static/style.css?v=79c23f0552ff">
</head>
<body id="exchange-planner">
<header class="identity">
  <a class="identity-link" href="../../" data-plan-link>
    <span class="school-badge" data-school="hku" aria-hidden="true">HKU</span>
    <span>Exchange Planner</span>
  </a>
</header>
<main>

  <div class="context" data-plan-route hidden>
    <div class="context-text">
      <span class="caption">Your exchange plan</span>
      <div class="context-universities">
        <span class="school-badge" data-school="hku">HKU</span>
        <span class="subtle" aria-hidden="true">→</span>

        <span class="school-badge" data-school=""
              data-destination-badge aria-hidden="true"></span>
        <strong data-destination-name></strong>
        <span class="subtle" data-semester-name></span>
      </div>
    </div>
    <a class="quiet-button" href="../../" data-plan-link>Change plan</a>
  </div>
  <nav class="workspace-nav" aria-label="Exchange tools">

    <a href="../1/" data-plan-link
       >Courses</a>

    <a href="../5/" data-plan-link
       >HKU Equivalents</a>

    <a href="./" data-plan-link
       aria-current="true">Timetable</a>

    <a href="../10/" data-plan-link
       >Insights</a>

  </nav>





<div class="course-content">
  <h1>Travel-friendly timetable</h1>
  <p class="feature-description">Find Monday to Wednesday classes that start at or after your chosen time.</p>

  <nav class="modes" aria-label="Timetable tools">

    <a href="./" data-plan-link
       aria-current="page">Travel-friendly classes</a>

    <a href="../11/" data-plan-link
       >Check clashes</a>

  </nav>




  <form class="form" data-feature="3" method="get"
        action="./" data-run-with-plan>


    <label>
      <span class="label">Exchange university</span>

        <select name="uni_id" required>
          <option value="">Choose exchange university</option>



          <option value="3"

            >University College London</option>



          <option value="2"

            >University of Toronto</option>

        </select>

    </label>


    <label>
      <span class="label">Semester</span>

        <select name="term">
          <option value="">Any semester</option>



          <option value="Sem 1"

            >Sem 1</option>



          <option value="Sem 2"

            >Sem 2</option>

        </select>

    </label>


    <label>
      <span class="label">Earliest start time</span>


        <input type="time" name="earliest_start" value="10:00"
                required>

    </label>

    <button type="submit" class="primary-button">Find classes</button>
  </form>





  <div id="preview-result" aria-live="polite" data-empty-message="No Monday to Wednesday classes match. Try an earlier start time."
       data-hidden-columns=""></div>



</div>

</main>

<script id="exchange-choices" type="application/json">{"destinations": [[3, "University College London"], [2, "University of Toronto"]], "semesters": ["Sem 1", "Sem 2"]}</script>

<script src="../../static/plan.js?v=171c22b763ea" defer></script>



<script src="../../static/sql-wasm.js?v=d6a9cc234ef1" defer></script>
<script src="../../static/preview.js?v=66158257ca14" defer></script>

</body>
</html>
