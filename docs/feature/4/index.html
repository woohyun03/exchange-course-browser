<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find courses without a final exam · Exchange Student Course Browser</title>
  <link rel="stylesheet" href="../../static/style.css?v=c8fd3053e0f9">
</head>
<body>

<header class="topbar">
  <a class="brand" href="../../" data-plan-link>Exchange Student Course Browser</a>

  <nav aria-label="Main navigation"><a href="../../" data-plan-link>All tools</a></nav>

</header>
<main>
  <p class="plan-route" data-plan-route hidden></p>

<h1 class="feature-title">Find courses without a final exam</h1>
<p class="dim feature-description">See exam-free classes actually offered in the selected semester.</p>


<form class="block form" data-feature="4" method="get" action="./" data-preserve-plan>

  <label>
    <span class="label">Exchange university</span>

      <select name="uni_id" required>
        <option value="">— choose —</option>



        <option value="3"

          >University College London</option>



        <option value="2"

          >University of Toronto</option>

      </select>

  </label>

  <label>
    <span class="label">Semester</span>

      <select name="term" required>
        <option value="">— choose —</option>



        <option value="Sem 1"

          >Sem 1</option>



        <option value="Sem 2"

          >Sem 2</option>

      </select>

  </label>

  <button type="submit">Find exam-free courses</button>
</form>


<div id="preview-result" aria-live="polite"></div>


</main>

<script id="exchange-choices" type="application/json">{"destinations": [[3, "University College London"], [2, "University of Toronto"]], "semesters": ["Sem 1", "Sem 2"]}</script>
<script src="../../static/plan.js?v=af92ba2f930c" defer></script>


<script src="../../static/sql-wasm.js?v=d6a9cc234ef1" defer></script>
<script src="../../static/preview.js?v=e29067605058" defer></script>

</body>
</html>
