<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare teaching loads · Exchange Planner</title>
  <link rel="stylesheet" href="../../static/style.css?v=a92f95160fb0">
</head>
<body id="exchange-planner" class="tool-page">
<header class="identity">
  <a class="identity-link" href="../../" data-plan-link>
    <img class="campus-mark" width="40" height="40" alt=""
     src="../../static/campus/hku.svg?v=58170c6886a2"
     >
    <span>Exchange Planner</span>
  </a>
  <span class="project-label">COMP3278 student project</span>
</header>
<main>

  <div class="context" data-plan-route hidden>
    <div class="context-text">
      <span class="caption visually-hidden">Your exchange plan</span>
      <div class="context-universities">
        <span class="plan-campus"><img class="campus-mark" width="40" height="40" alt=""
     src="../../static/campus/hku.svg?v=58170c6886a2"
     > <strong>HKU</strong></span>
        <span class="subtle" aria-hidden="true">→</span>

        <span class="plan-campus">
          <img class="campus-mark" width="40" height="40" alt=""
     hidden
     data-destination-mark>
          <strong data-destination-name></strong>
        </span>
        <span class="subtle" data-semester-name></span>
      </div>
    </div>
    <a class="quiet-button" href="../../" data-plan-link>Change plan</a>
  </div>
  <nav class="workspace-nav" aria-label="Exchange tools">

    <a href="../1/" data-plan-link
       >Courses</a>

    <a href="../5/" data-plan-link
       >HKU Equivalents</a>

    <a href="../3/" data-plan-link
       >Timetable</a>

    <a href="../10/" data-plan-link
       aria-current="true">Insights</a>

    <a href="../../my-plan/" data-plan-link
       >My Plan</a>
  </nav>





<div class="course-content insight-content">
  <h1>Insights</h1>
  <nav class="insight-tools" aria-label="Insights tools">

    <a href="../10/" data-plan-link
       >
      Popular courses
    </a>

    <a href="../8/" data-plan-link
       >
      Failure rates
    </a>

    <a href="./" data-plan-link
       aria-current="page">
      Teaching loads
    </a>

    <a href="../7/" data-plan-link
       >
      Sample student progress
    </a>

  </nav>
  <section class="insight-panel" aria-labelledby="insight-title">
    <h2 id="insight-title" class="visually-hidden">Compare teaching loads</h2>




  <form class="form" data-feature="6" method="get"
        action="./" data-run-with-plan>


    <label>
      <span class="label">Exchange university</span>

        <select name="uni_id" required>
          <option value="">Choose exchange university</option>



          <option value="3"


            >University College London</option>



          <option value="2"


            >University of Toronto</option>

        </select>

    </label>


    <label>
      <span class="label">Semester</span>

        <select name="term" required>
          <option value="">Choose semester</option>



          <option value="Sem 1"


            >Sem 1</option>



          <option value="Sem 2"


            >Sem 2</option>

        </select>

    </label>

    <button type="submit" class="primary-button">Show teaching loads</button>
  </form>







  <div id="preview-result" aria-live="polite" data-empty-message="No results match these filters."
       data-hidden-columns="courseID,studentID,teacherID"></div>



  </section>
</div>

</main>

<template id="campus-marks">

  <img data-campus="2" src="../../static/campus/toronto.svg?v=8e8869192932" alt="">

  <img data-campus="3" src="../../static/campus/ucl.svg?v=b197e17c76cd" alt="">

</template>
<script id="exchange-choices" type="application/json">{"destinations": [[3, "University College London"], [2, "University of Toronto"]], "semesters": ["Sem 1", "Sem 2"]}</script>
<script id="campus-photos" type="application/json">{"2": {"alt": "Entrance to University College at the University of Toronto", "city": "Toronto, Canada", "credit": "City of Toronto", "file": "toronto.jpg", "license": "CC BY 2.0", "license_url": "https://creativecommons.org/licenses/by/2.0/", "mark": "toronto", "source": "https://commons.wikimedia.org/wiki/File:University_College_in_Toronto.jpg"}, "3": {"alt": "Columns of the University College London portico", "city": "London, United Kingdom", "credit": "Raya Sharbain", "file": "ucl.jpg", "license": "CC BY-SA 4.0", "license_url": "https://creativecommons.org/licenses/by-sa/4.0/", "mark": "ucl", "source": "https://commons.wikimedia.org/wiki/File:Portico_of_University_College_London.jpg"}}</script>
<script src="../../static/plan.js?v=7d77d151b93d" defer></script>




<script src="../../static/feature-results.js?v=6beabffcf631" defer></script>


<script src="../../static/sql-wasm.js?v=d6a9cc234ef1" defer></script>
<script src="../../static/preview.js?v=d5debc08cf63" defer></script>

</body>
</html>
