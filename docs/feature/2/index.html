<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse by university and department · Exchange Planner</title>
  <link rel="stylesheet" href="../../static/style.css?v=3cb58a5b8d0e">
</head>
<body id="exchange-planner">
<header class="identity">
  <a class="identity-link" href="../../" data-plan-link>
    <img class="campus-mark" width="40" height="40" alt=""
     src="../../static/campus/hku.svg?v=58170c6886a2"
     >
    <span>Exchange Planner</span>
  </a>
  <span class="project-label">COMP3278 student project</span>
</header>
<main>

  <div class="context" data-plan-route hidden>
    <div class="context-text">
      <span class="caption">Your exchange plan</span>
      <div class="context-universities">
        <span class="plan-campus"><img class="campus-mark" width="40" height="40" alt=""
     src="../../static/campus/hku.svg?v=58170c6886a2"
     > <strong>HKU</strong></span>
        <span class="subtle" aria-hidden="true">→</span>

        <span class="plan-campus">
          <img class="campus-mark" width="40" height="40" alt=""
     hidden
     data-destination-mark>
          <strong data-destination-name></strong>
        </span>
        <span class="subtle" data-semester-name></span>
      </div>
    </div>
    <a class="quiet-button" href="../../" data-plan-link>Change plan</a>
  </div>
  <nav class="workspace-nav" aria-label="Exchange tools">

    <a href="../1/" data-plan-link
       aria-current="true">Courses</a>

    <a href="../5/" data-plan-link
       >HKU Equivalents</a>

    <a href="../3/" data-plan-link
       >Timetable</a>

    <a href="../10/" data-plan-link
       >Insights</a>

  </nav>





<div class="course-content">
  <h1>Find courses</h1>


  <nav class="modes" aria-label="Courses tools">

    <a href="../1/" data-plan-link
       >Search by name</a>

    <a href="./" data-plan-link
       aria-current="page">By department</a>

    <a href="../4/" data-plan-link
       >No final exam</a>

  </nav>




  <form class="form course-form" data-feature="2" method="get"
        action="./">


    <label>
      <span class="label">Exchange university</span>

        <select name="uni_id" required>
          <option value="">Choose exchange university</option>



          <option value="3"

            >University College London</option>



          <option value="2"

            >University of Toronto</option>

        </select>

    </label>


    <label>
      <span class="label">Department</span>

        <select name="dept_id" required>
          <option value="">Choose department</option>



          <option value="1"

            >Computer Science</option>



          <option value="3"

            >Economics</option>



          <option value="4"

            >Finance</option>



          <option value="8"

            >History</option>



          <option value="7"

            >Linguistics</option>



          <option value="9"

            >Marketing</option>



          <option value="2"

            >Mathematics</option>



          <option value="6"

            >Physics</option>



          <option value="5"

            >Psychology</option>



          <option value="10"

            >Statistics</option>

        </select>

    </label>


    <label>
      <span class="label">Semester</span>

        <select name="term">
          <option value="">Any semester</option>



          <option value="Sem 1"

            >Sem 1</option>



          <option value="Sem 2"

            >Sem 2</option>

        </select>

    </label>

    <button type="submit" class="primary-button">Browse courses</button>
  </form>



  <div id="course-results" data-details-url=""
       data-clashes-url="../11/" aria-live="polite"></div>
  <template id="course-result-row">
    <article class="course-row">
      <div class="course-main">
        <div class="course-title"><h2></h2><p class="course-meta"></p></div>
        <span class="exam-status"></span>
      </div>
      <div class="course-actions">
        <button type="button" class="row-action" data-detail="equivalent" aria-expanded="false">Check HKU equivalent</button>
        <button type="button" class="row-action" data-detail="times" aria-expanded="false">View class times</button>
      </div>
      <div class="course-detail" hidden aria-live="polite">
        <span class="caption"></span><div class="detail-content"></div>
      </div>
    </article>
  </template>



  <div id="preview-result" aria-live="polite" data-empty-message="No results match these filters."
       data-hidden-columns=""></div>



</div>

</main>

<template id="campus-marks">

  <img data-campus="2" src="../../static/campus/toronto.svg?v=8e8869192932" alt="">

  <img data-campus="3" src="../../static/campus/ucl.svg?v=b197e17c76cd" alt="">

</template>
<script id="exchange-choices" type="application/json">{"destinations": [[3, "University College London"], [2, "University of Toronto"]], "semesters": ["Sem 1", "Sem 2"]}</script>
<script id="campus-photos" type="application/json">{"2": {"alt": "Entrance to University College at the University of Toronto", "city": "Toronto, Canada", "credit": "City of Toronto", "file": "toronto.jpg", "license": "CC BY 2.0", "license_url": "https://creativecommons.org/licenses/by/2.0/", "mark": "toronto", "source": "https://commons.wikimedia.org/wiki/File:University_College_in_Toronto.jpg"}, "3": {"alt": "Columns of the University College London portico", "city": "London, United Kingdom", "credit": "Raya Sharbain", "file": "ucl.jpg", "license": "CC BY-SA 4.0", "license_url": "https://creativecommons.org/licenses/by-sa/4.0/", "mark": "ucl", "source": "https://commons.wikimedia.org/wiki/File:Portico_of_University_College_London.jpg"}}</script>
<script src="../../static/plan.js?v=1dd0953d48ae" defer></script>


<script src="../../static/course-results.js?v=4a9a79805efa" defer></script>


<script src="../../static/sql-wasm.js?v=d6a9cc234ef1" defer></script>
<script src="../../static/preview.js?v=66158257ca14" defer></script>

</body>
</html>
