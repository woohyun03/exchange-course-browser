<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse by university and department · Exchange Student Course Browser</title>
  <link rel="stylesheet" href="../../static/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="../../">Exchange Student Course Browser</a>

  <nav aria-label="Main navigation"><a href="../../">All tools</a></nav>

</header>
<main>

<h1 class="feature-title">Browse by university and department</h1>
<p class="dim feature-description">Find courses offered by a specific university and department.</p>


<form class="block form" data-feature="2" method="get" action="./">

  <label>
    <span class="label">University</span>

      <select name="uni_id" required>
        <option value="">— choose —</option>

        <option value="1" >The University of Hong Kong</option>

        <option value="3" >University College London</option>

        <option value="2" >University of Toronto</option>

      </select>

  </label>

  <label>
    <span class="label">Department</span>

      <select name="dept_id" required>
        <option value="">— choose —</option>

        <option value="1" >Computer Science</option>

        <option value="3" >Economics</option>

        <option value="4" >Finance</option>

        <option value="8" >History</option>

        <option value="7" >Linguistics</option>

        <option value="9" >Marketing</option>

        <option value="2" >Mathematics</option>

        <option value="6" >Physics</option>

        <option value="5" >Psychology</option>

        <option value="10" >Statistics</option>

      </select>

  </label>

  <button type="submit">Browse courses</button>
</form>


<div id="preview-result" aria-live="polite"></div>


</main>

<script src="../../static/sql-wasm.js" defer></script>
<script src="../../static/preview.js" defer></script>

</body>
</html>
