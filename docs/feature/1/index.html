<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search courses by name · Exchange Planner</title>
  <link rel="stylesheet" href="../../static/style.css?v=75b02a69559b">
</head>
<body id="exchange-planner" class="tool-page">
<header class="identity">
  <a class="identity-link" href="../../" data-plan-link>
    <img class="campus-mark" width="40" height="40" alt=""
     src="../../static/campus/hku.svg?v=58170c6886a2"
     >
    <span>Exchange Planner</span>
  </a>
  <span class="project-label">COMP3278 student project</span>
</header>
<main>

  <div class="context" data-plan-route hidden>
    <div class="context-text">
      <span class="caption visually-hidden">Your exchange plan</span>
      <div class="context-universities">
        <span class="plan-campus"><img class="campus-mark" width="40" height="40" alt=""
     src="../../static/campus/hku.svg?v=58170c6886a2"
     > <strong>HKU</strong></span>
        <span class="subtle" aria-hidden="true">→</span>

        <span class="plan-campus">
          <img class="campus-mark" width="40" height="40" alt=""
     hidden
     data-destination-mark>
          <strong data-destination-name></strong>
        </span>
        <span class="subtle" data-semester-name></span>
      </div>
    </div>
    <a class="quiet-button" href="../../" data-plan-link>Change plan</a>
  </div>
  <nav class="workspace-nav" aria-label="Exchange tools">

    <a href="./" data-plan-link data-courses-entry
       aria-current="true">Courses</a>

    <a href="../5/" data-plan-link
       >HKU Equivalents</a>

    <a href="../3/" data-plan-link
       >Timetable</a>

    <a href="../10/" data-plan-link
       >Insights</a>

    <a href="../../my-plan/" data-plan-link
       >My Plan <span data-plan-count hidden></span></a>
  </nav>





<div class="course-content">
  <h1>Find courses</h1>

  <div class="course-filters">

  <details class="course-views"><summary>More course views</summary>
  <nav class="modes" aria-label="Courses tools">

    <a href="./" data-plan-link
       data-courses-entry
       aria-current="page">Search by name</a>

    <a href="../2/" data-plan-link

       >By department</a>

    <a href="../4/" data-plan-link

       >No final exam</a>

  </nav>
  </details>





  <form class="form course-form" data-feature="1" method="get"
        action="./" data-run-with-plan>


    <label>
      <span class="label visually-hidden">Course name keyword</span>


        <input type="search" name="keyword" value=""
               placeholder="Search course names"
               >

    </label>


    <label>
      <span class="label">Exchange university</span>

        <select name="uni_id">
          <option value="">Choose exchange university</option>



          <option value="3"


            >University College London</option>



          <option value="2"


            >University of Toronto</option>

        </select>

    </label>


    <label>
      <span class="label">Semester</span>

        <select name="term">
          <option value="">Any semester</option>



          <option value="Sem 1"


            >Sem 1</option>



          <option value="Sem 2"


            >Sem 2</option>

        </select>

    </label>


    <label>
      <span class="label">Department</span>
      <select name="department" data-catalogue-filter>
        <option value="">All departments</option>
      </select>
    </label>
    <label class="exam-filter">
      <input type="checkbox" name="exam_free" value="1" data-catalogue-filter>
      <span>No final exam</span>
    </label>

    <button type="submit" class="primary-button">Search courses</button>
  </form>


  </div>


  <div id="course-results" data-details-url=""
       data-clashes-url="../11/"
       data-reset-url="./" aria-live="polite"></div>
  <template id="course-result-row">
    <article class="course-row">
      <div class="course-main">
        <div class="course-title"><h2></h2><p class="course-meta"></p></div>
        <span class="exam-status"></span>
      </div>
      <div class="course-actions">
        <button type="button" class="save-course" data-save-course aria-pressed="false" hidden>Add to My Plan</button>
        <button type="button" class="row-action" data-detail="equivalent" aria-expanded="false">Check HKU equivalent</button>
        <button type="button" class="row-action" data-detail="times" aria-expanded="false">View class times</button>
      </div>
      <div class="course-details">
        <section class="course-detail" data-panel="equivalent" hidden aria-live="polite">
          <h3>HKU equivalent</h3><div class="detail-content"></div>
        </section>
        <section class="course-detail" data-panel="times" hidden aria-live="polite">
          <h3>Class times</h3><div class="detail-content"></div>
        </section>
      </div>
    </article>
  </template>



  <div id="preview-result" aria-live="polite" data-empty-message="No results match these filters."
       data-hidden-columns=""></div>




</div>

</main>

<template id="campus-marks">

  <img data-campus="2" src="../../static/campus/toronto.svg?v=8e8869192932" alt="">

  <img data-campus="3" src="../../static/campus/ucl.svg?v=b197e17c76cd" alt="">

</template>
<script id="exchange-choices" type="application/json">{"destinations": [[3, "University College London"], [2, "University of Toronto"]], "semesters": ["Sem 1", "Sem 2"]}</script>

<script src="../../static/plan.js?v=439967dee5aa" defer></script>



<script src="../../static/sql-wasm.js?v=d6a9cc234ef1" defer></script>
<script src="../../static/preview.js?v=9c83424c8660" defer></script>


<script src="../../static/my-plan.js?v=4b7e3d259822" defer></script>


<script src="../../static/course-results.js?v=b2d80e3b2567" defer></script>


</body>
</html>
